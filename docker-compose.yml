version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: stocksense_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: stocksense_db
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    ports:
      - "5433:5432"
    volumes:
      - stocksense_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d stocksense_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - stocksense_net

  kafka:
    image: apache/kafka:3.7.0
    container_name: stocksense_kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - stocksense_net

  odoo:
    build:
      context: .
      dockerfile: Dockerfile.odoo
    container_name: stocksense_odoo
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_started
    ports:
      - "8069:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
      KAFKA_BROKER: kafka:9092
    volumes:
      - ./stocksense:/mnt/extra-addons/stocksense
      - ./odoo.conf:/etc/odoo/odoo.conf
      - stocksense_odoo_data:/var/lib/odoo
    networks:
      - stocksense_net

  consumers:
    build:
      context: .
      dockerfile: Dockerfile.consumers
    container_name: stocksense_consumers
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_started
      db:
        condition: service_healthy
    environment:
      KAFKA_BROKER: kafka:9092
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: stocksense_db
      DB_USER: odoo
      DB_PASSWORD: odoo
    volumes:
      - ./consumers:/app/consumers
      - ./stocksense/services:/app/stocksense/services
    networks:
      - stocksense_net

volumes:
  stocksense_db_data:
  stocksense_odoo_data:

networks:
  stocksense_net:
    driver: bridge
